# This file is included from nginx.conf's http {} context by the official image.
# Keep response headers here at server scope: nginx 1.28 replaces inherited
# add_header directives when a child location defines its own.
map $uri $farm_cache_control {
    default "no-cache, max-age=0, must-revalidate";
    "~^/releases/[0-9]{8}T[0-9]{6}Z-[a-f0-9]{12}/(?:app|plan-worker)\.js$" "public, max-age=31536000, immutable";
}

map $uri $farm_content_disposition {
    default "";
    /collection/plots.json "attachment; filename=\"yield-farm-plots.json\"";
    /farm-companion-chrome.zip "attachment; filename=\"farm-companion-chrome.zip\"";
}

map $uri $farm_collection_cors {
    default "";
    /collection/status.json "*";
    /collection/plots.json "*";
}

server {
    listen 8080 default_server;
    server_name _;
    root /srv/farm/current;
    server_tokens off;
    autoindex off;
    etag on;

    # The container only serves static files through Traefik's HTTPS router.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    add_header Access-Control-Allow-Origin $farm_collection_cors always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.rh.farm; frame-src https://api.rh.farm; worker-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://rpc.mainnet.chain.robinhood.com https://robinhood-rpc.publicnode.com https://api.rh.farm https://api.coinbase.com https://farm.pagzi.tech; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $farm_cache_control always;
    add_header Content-Disposition $farm_content_disposition always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css text/plain;

    location = / {
        try_files /index.html =404;
    }

    # Public root files only. Everything else, including _headers, source,
    # portfolio data, and arbitrary paths, is rejected by the final location.
    location ~ ^/(?:index\.html|app\.js|plan-worker\.js|yield-farm-companion\.user\.js|farm-companion-chrome\.zip|build\.json|ART-CREDITS\.txt|FONT-LICENSES\.txt|INSTALL-CHROME\.txt|README\.txt)$ {
        try_files $uri =404;
    }

    # Old open pages keep resolving their worker beside the versioned app.
    # The release ID and the two permitted file names are deliberately strict.
    location ~ "^/releases/(?<release_id>[0-9]{8}T[0-9]{6}Z-[a-f0-9]{12})/(?<release_file>app\.js|plan-worker\.js)$" {
        alias /srv/farm/releases/$release_id/$release_file;
    }

    # Only normalized public collection outputs; private raw/state are outside site.
    location = /collection/status.json {
        alias /srv/farm/collection/status.json;
    }
    location = /collection/plots.json {
        alias /srv/farm/collection/plots.json;
    }

    location / {
        return 404;
    }
}
